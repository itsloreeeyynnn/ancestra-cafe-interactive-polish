<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Admin Dashboard | Ancestra Cafe</title>
  <meta name="robots" content="noindex">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700;900&family=Rhodium+Libre:wght@400&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body data-page="admin">
  <div id="site-header"></div>

  <!-- Login -->
  <main id="loginView" class="section-pad">
    <div class="container"><div class="row justify-content-center"><div class="col-md-6 col-lg-4">
      <form id="loginForm" class="card-soft p-4" novalidate>
        <h1 class="h3 mb-1">Ancestra Cafe – Demo Admin</h1>
        <p class="small text-muted-2">Demo password: <span class="code-chip">admin123</span></p>
        <div class="mb-3"><label for="adminPass" class="form-label">Password</label>
          <input type="password" id="adminPass" class="form-control" required>
          <div class="invalid-feedback">Incorrect password.</div></div>
        <button class="btn btn-blue w-100" type="submit">Sign in</button>
      </form>
    </div></div></div>
  </main>

  <!-- Dashboard -->
  <main id="dashView" class="section-pad pt-4 d-none">
    <div class="container">
      <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h2 mb-0">Admin dashboard</h1>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-blue btn-sm" id="exportBtn" type="button"><i class="bi bi-download me-1"></i>Export CSV (demo orders)</button>
          <button class="btn btn-outline-danger btn-sm" id="resetDemo" type="button">Reset demo data</button>
          <button class="btn btn-blue btn-sm" id="logoutBtn" type="button">Sign out</button>
        </div>
      </div>

      <ul class="nav nav-pills admin-sidebar mb-4 flex-wrap" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tabOverview" type="button">Overview</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabRes" type="button">Demo Reservations <span class="badge text-bg-warning" id="resBadge">0</span></button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabOrders" type="button">Demo Orders <span class="badge text-bg-warning" id="ordBadge">0</span></button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tabReviews" type="button">Reviews</button></li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="tabOverview">
          <div class="row row-cols-2 row-cols-lg-4 g-3 mb-4" id="statCards"></div>
          <div class="row g-4">
            <div class="col-lg-6"><div class="card-soft p-4 h-100"><h2 class="h5">Order status</h2><div id="statusBars"></div></div></div>
            <div class="col-lg-6"><div class="card-soft p-4 h-100"><h2 class="h5">Top selling items</h2><ol class="mb-0" id="topItems"></ol></div></div>
          </div>
        </div>

        <div class="tab-pane fade" id="tabRes"><div class="card-soft p-3">
          <div class="table-responsive"><table class="table align-middle mb-0">
            <thead><tr><th>Ref</th><th>Guest</th><th>When</th><th>Pax</th><th>Notes</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="resBody"></tbody></table></div></div></div>

        <div class="tab-pane fade" id="tabOrders"><div class="card-soft p-3">
          <div class="table-responsive"><table class="table align-middle mb-0">
            <thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="ordBody"></tbody></table></div></div></div>

        <div class="tab-pane fade" id="tabReviews"><div class="card-soft p-3">
          <div class="table-responsive"><table class="table align-middle mb-0">
            <thead><tr><th>Guest</th><th>Rating</th><th>Review</th><th>Visibility</th><th class="text-end">Actions</th></tr></thead>
            <tbody id="revBody"></tbody></table></div></div></div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/reviews-data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
