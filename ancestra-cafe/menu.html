<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Menu | Ancestra Cafe</title><meta name="description" content="Ancestra Cafe menu in Argao, Cebu.">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@400;500;600;700;900&family=Rhodium+Libre:wght@400&display=swap" rel="stylesheet"><link href="css/style.css?v=2" rel="stylesheet">  <link rel="icon" type="image/jpeg" href="images/favicon.jpg" />
  <meta name="theme-color" content="#284484" />
  </head>
<body data-page="menu"><div id="site-header"></div><header class="page-hero"><div class="container"><p class="eyebrow">Ancestra Cafe</p><h1>Menu</h1><p class="lead mb-0">Explore the menu boards and find your favorites.</p></div></header>
<main class="section-pad pt-5"><div class="container">
<div class="row g-4 justify-content-center mb-5"><div class="col-md-5"><a href="images/2.jpg" target="_blank" rel="noopener"><img class="img-fluid menu-board" src="images/2.jpg" alt="Ancestra Cafe coffee, non-coffee and ice blended drinks menu board"></a></div><div class="col-md-5"><a href="images/3.jpg" target="_blank" rel="noopener"><img class="img-fluid menu-board" src="images/3.jpg" alt="Ancestra Cafe food menu board"></a></div></div>
<div class="card-soft p-3 p-md-4 mb-4"><div class="row g-3 align-items-end"><div class="col-12 col-lg-5"><label for="searchInput" class="form-label small mb-1">Search the menu</label><div class="input-group"><span class="input-group-text bg-white"><i class="bi bi-search"></i></span><input type="search" id="searchInput" class="form-control" placeholder="Search coffee, pasta, salad…"></div></div><div class="col-6 col-lg-2"><label for="dietSelect" class="form-label small mb-1">Menu type</label><select id="dietSelect" class="form-select"><option value="all">All items</option><option value="drink">Drinks</option><option value="food">Food</option></select></div>
<div class="col-6 col-lg-2"><label for="allergenSelect" class="form-label small mb-1">Dietary</label><select id="allergenSelect" class="form-select"><option value="all">All</option><option value="vegetarian">Vegetarian</option><option value="Dairy">No dairy</option><option value="Nuts">No nuts</option><option value="Gluten">No gluten</option><option value="Shellfish">No shellfish</option></select></div><div class="col-6 col-lg-2"><label for="sortSelect" class="form-label small mb-1">Sort by</label><select id="sortSelect" class="form-select"><option value="default">Menu order</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="az">Name: A–Z</option></select></div><div class="col-12 col-lg-3 d-flex justify-content-between align-items-center"><div class="form-check form-switch mb-0"><input class="form-check-input" type="checkbox" role="switch" id="favToggle"><label class="form-check-label" for="favToggle">Favorites only</label></div><button class="btn btn-link btn-sm" id="resetFilters" type="button">Reset</button></div></div><div class="d-flex flex-wrap gap-2 mt-3" id="catPills" role="group" aria-label="Menu categories"></div></div>
<div id="recentlyViewed" class="mb-4"></div>
<div id="recommended" class="mb-4"></div>
<p class="text-muted-2 small" id="resultCount" aria-live="polite"></p><div class="row row-cols-2 row-cols-sm-3 row-cols-lg-4 row-cols-xl-5 g-2" id="menuGrid"></div><div id="emptyState" class="text-center py-5 d-none"><i class="bi bi-cup display-3 text-muted-2"></i><h3 class="mt-3">Nothing matches that search</h3><p class="text-muted-2">Try a different word or clear your filters.</p></div>

</div></main><div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg"><div class="modal-content p-4" id="itemModalContent"></div></div>
</div>
<div id="site-footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/main.js"></script><script src="js/cart.js"></script><script src="js/menu.js"></script></body></html>
